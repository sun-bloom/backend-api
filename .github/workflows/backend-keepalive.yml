# .github/workflows/backend-keepalive.yml
#
# PURPOSE:
#   Prevents Render Free-tier services from sleeping due to inactivity.
#   Sends a lightweight GET /health ping to the backend every 14 minutes.
#
# HEALTH ENDPOINT:
#   GET /health is a read-only endpoint registered in server.js (before CORS middleware).
#   Response: { "ok": true, "timestamp": "<ISO datetime>" }
#   - No authentication required
#   - No database writes
#   - No business logic
#   - No secrets exposed
#
# IMPORTANT NOTES:
#   - All requests are read-only (GET /health).
#   - No data is written, no orders created, no business logic triggered.
#   - No secrets or credentials are used.
#   - Render Free services sleep after ~15 min of inactivity.
#     Pinging every 14 min keeps them awake during active testing/production use.
#   - This does NOT guarantee the service stays awake; it reduces the likelihood
#     of cold starts during the period this workflow runs.
#
# BACKENDS TARGETED:
#   Backend API (primary) : https://backend-api-bonr.onrender.com
#   (Only one confirmed active backend. sunbloom-api.onrender.com returns 404 and is NOT pinged.)
#
# TO DISABLE:
#   Delete or rename this file, or remove/comment the `schedule:` block.

name: Backend Keep-Alive Ping

on:
  schedule:
    # Every 14 minutes — keeps Render Free services awake before the 15-min idle cutoff.
    # GitHub Actions cron uses UTC. Minimum supported schedule is every 5 minutes.
    - cron: '*/14 * * * *'
  # Allow manual trigger from GitHub Actions UI for testing without waiting for schedule
  workflow_dispatch:

jobs:
  ping:
    name: Ping Backend Health Endpoint
    runs-on: ubuntu-latest
    # Fail the whole job if it takes longer than 5 minutes (Render cold start is usually <60s)
    timeout-minutes: 5

    steps:
      - name: Ping Backend API — backend-api-bonr.onrender.com/health
        run: |
          echo "Sending keep-alive ping to https://backend-api-bonr.onrender.com/health ..."
          HTTP_STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 45 \
            "https://backend-api-bonr.onrender.com/health")
          echo "HTTP status received: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "OK: Backend is alive and healthy."
          else
            echo "ERROR: Health check returned HTTP $HTTP_STATUS (expected 200)."
            echo "The Render service may be down or the endpoint may have changed."
            exit 1
          fi
